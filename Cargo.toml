[package]
name = "mihomo-tui"
version = "0.1.0"
edition = "2024"
description = "面向 Linux 服务器、适合通过 SSH 使用的 Mihomo 终端控制中心"
license = "MIT"
repository = "https://github.com/bilbilmyc/mihomo-tui"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
urlencoding = "2.1"
