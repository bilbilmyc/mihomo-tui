name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
      - "!automation/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install shell linter
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-targets --locked
      - name: Lint
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          shellcheck -e SC1090 scripts/*.sh scripts/lib/*.sh
      - name: Test release policies
        run: |
          ./scripts/test-sync-managed-core.sh
          ./scripts/test-build-deb-policy.sh
          ./scripts/test-build-release-policy.sh
          ./scripts/test-ci-release-policy.sh

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

  packages:
    name: packages (${{ matrix.rust-architecture }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust-architecture: x86_64
            debian-architecture: amd64
          - runner: ubuntu-24.04-arm
            rust-architecture: aarch64
            debian-architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: ./.github/actions/build-linux-packages
        with:
          rust-architecture: ${{ matrix.rust-architecture }}
          debian-architecture: ${{ matrix.debian-architecture }}

  prepare-draft-release:
    name: prepare-draft-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, security-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate version tag
        shell: bash
        run: |
          app_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$app_version"
      - name: Prepare draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" || {
              echo "refusing to replace assets on a published release" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "mihomo-tui $GITHUB_REF_NAME" \
              --verify-tag
          fi

  release-packages:
    name: release-packages (${{ matrix.rust-architecture }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prepare-draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust-architecture: x86_64
            debian-architecture: amd64
          - runner: ubuntu-24.04-arm
            rust-architecture: aarch64
            debian-architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: ./.github/actions/build-linux-packages
        with:
          rust-architecture: ${{ matrix.rust-architecture }}
          debian-architecture: ${{ matrix.debian-architecture }}
      - name: Upload verified files to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  verify-draft-release:
    name: verify-draft-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          mkdir release-dist
          gh release download "$GITHUB_REF_NAME" --dir release-dist
          test "$(find release-dist -maxdepth 1 -type f | wc -l)" -eq 12
          cd release-dist
          sha256sum --check -- *.sha256
