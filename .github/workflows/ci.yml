name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test managed-core sync policy
        run: ./scripts/test-sync-managed-core.sh
      - name: Test Debian bundle policy
        run: ./scripts/test-build-deb-policy.sh

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}

  release-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x86_64
            debian: amd64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            debian: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native architecture
        run: 'rustc -vV | grep "host: ${{ matrix.architecture }}-unknown-linux-gnu"'
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build Debian bundle
        run: ./scripts/build-deb.sh --architecture "${{ matrix.debian }}"
      - name: Verify Debian bundle
        run: ./scripts/test-deb-package.sh dist/*.deb
      - name: Install bundle on disposable runner
        run: sudo ./scripts/test-install-deb.sh dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-tui-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
